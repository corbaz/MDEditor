schema: spec-driven
project: mdeditor
initialized: 2026-05-31
artifact_store: hybrid

context: |
  Tech stack: Electron 42 + React 19 + Vite 8 + TypeScript ~6.0 + MDXEditor 4
  Package manager: bun (bun.lock present)
  Entry: src/main.tsx -> src/App.tsx (God-component ~2565 lines, refactor candidate)
  Electron main: electron/main.cjs | preload: electron/preload.cjs
  Module system: ESM (type: module), Vite bundler, CommonJS for Electron layer
  Target: Desktop app (Windows NSIS, macOS DMG) via electron-builder
  Testing: Vitest 4.1.7 with 114 characterization tests over src/App.tsx pure helpers. strict_tdd: true.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Flag changes that touch the App.tsx God-component
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Flag IPC channel changes (main <-> renderer boundary)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    tdd: true
    test_command: "bun run test"
  verify:
    test_command: "bun run test"
    build_command: "bun run build"
    lint_command: "bun run lint"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  runner: "vitest"
  reason: "Vitest 4.1.7 installed via change add-test-safety-net; 114 characterization tests cover 17 pure helpers in src/App.tsx"
  layers:
    unit: true
  coverage: true
  quality:
    linter: "bun run lint (eslint with typescript-eslint + react-hooks + react-refresh)"
    type_checker: "tsc -b (strict: noUnusedLocals, noUnusedParameters, erasableSyntaxOnly)"
    formatter: null
